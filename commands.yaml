# 로컬 실행 옵션은 터미널 플래그 대신 여기서 관리합니다.

default: full

commands:
  smoke:
    output: musinsa_standard_female_sku.xlsx
    max_products: 20
    max_scrolls: 80
    delay: 0.8
    headless: true
    skip_options: false
    workers: 1
    browser: auto

  listing_only:
    output: musinsa_standard_female_listing.xlsx
    max_products: 20
    max_scrolls: 80
    delay: 0.8
    headless: true
    skip_options: true
    workers: 1
    browser: auto

  full:
    output: musinsa_standard_female_sku.xlsx
    max_products: 0
    max_scrolls: 2000
    delay: 2.0
    headless: true
    skip_options: false
    workers: 8
    browser: auto
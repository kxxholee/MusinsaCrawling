[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musinsa-sku-generator"
version = "0.1.0"
description = "Musinsa Standard female SKU Excel generator demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "rich>=15.0.0",
    "selenium>=4.20.0",
]

[project.scripts]
musinsa-sku = "musinsa.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/musinsa"]
